<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>汉语 · Первые иероглифы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Spectral:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 600px 400px at 15% -5%, rgba(166,51,43,0.10), transparent 60%),
      radial-gradient(ellipse 500px 350px at 100% 15%, rgba(184,147,62,0.08), transparent 55%),
      #1B1B20;
    background-attachment: fixed;
    color: #E8E1CF;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { transition: transform 0.12s ease, opacity 0.12s ease; }
  button:active { transform: scale(0.95); opacity: 0.85; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .screen-enter { animation: fadeSlideIn 0.32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes glowPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(166,51,43,0.35); } 50% { box-shadow: 0 0 0 8px rgba(166,51,43,0); } }
  @keyframes celebrate { 0% { transform: scale(1); } 30% { transform: scale(1.06); } 60% { transform: scale(0.98); } 100% { transform: scale(1); } }
  @keyframes ringDraw { from { stroke-dashoffset: 351.9; } }
  @keyframes floatSlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .wrap { max-width: 420px; margin: 0 auto; padding: 32px 20px 64px; }
  .hanzi { font-family: 'Noto Serif SC', serif; }
  .display { font-family: 'Spectral', serif; font-style: italic; }

  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.6; margin: 0 0 4px; }
  h1 { font-size: 24px; margin: 0; }
  .seal {
    width: 64px; height: 64px; border: 4px solid #A6332B; color: #A6332B;
    border-radius: 4px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; transform: rotate(-3deg); font-family: 'Noto Serif SC', serif;
    flex-shrink: 0;
  }
  .seal b { font-size: 18px; line-height: 1; }
  .seal span { font-size: 10px; line-height: 1; margin-top: 4px; opacity: 0.7; }

  nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  nav button {
    font-family: 'Inter', sans-serif; font-size: 12px; padding: 7px 14px; border-radius: 999px;
    white-space: nowrap; border: 1px solid #4A4A52; background: transparent; color: #B8B3A5;
  }
  nav button.active { background: #A6332B; border-color: #A6332B; color: #E8E1CF; }

  .word-level-btn {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
    border: 1px solid #4A4A52; background: transparent; color: #B8B3A5; flex: 1;
  }
  .word-level-btn.active { background: #B8933E; border-color: #B8933E; color: #1B1B20; }

  .lesson-select-wrap { position: relative; margin-bottom: 20px; }
  .lesson-select-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-radius: 10px; border: 1px solid #4A4A52; background: #232328;
    color: #E8E1CF; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
  }
  .lesson-select-count { font-size: 11px; opacity: 0.5; font-weight: 400; margin-left: auto; margin-right: 6px; }
  .lesson-select-arrow { color: #B8933E; font-size: 12px; }
  .lesson-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    background: #232328; border: 1px solid #4A4A52; border-radius: 10px;
    max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .lesson-dropdown-item {
    width: 100%; text-align: left; padding: 11px 16px; background: transparent; border: none;
    border-bottom: 1px solid #33333a; color: #E8E1CF; font-family: 'Inter', sans-serif; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .lesson-dropdown-item:last-child { border-bottom: none; }
  .lesson-dropdown-item.active { background: #A6332B; color: #E8E1CF; }
  .lesson-dropdown-item .ld-count { font-size: 11px; opacity: 0.5; }

  .modes { display: flex; gap: 8px; margin-bottom: 24px; }
  .modes button {
    flex: 1; font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid #4A4A52;
    background: transparent; color: #B8B3A5; font-family: 'Inter', sans-serif;
  }
  .modes button.active { background: #B8933E; border-color: #B8933E; color: #1B1B20; font-weight: 600; }

  .flip-card { perspective: 1200px; margin-bottom: 20px; height: 310px; cursor: pointer; }
  .flip-card:active .flip-inner { transform: scale(0.98) rotateY(var(--fy, 0deg)); }
  .flip-inner {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.34,1.56,.64,1);
    filter: drop-shadow(0 10px 24px rgba(0,0,0,0.35));
  }
  .flip-inner.flipped { transform: rotateY(180deg); }
  .flip-face {
    position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 16px;
  }
  .flip-front { background: #E8E1CF; color: #1B1B20; }
  .flip-back { background: #A6332B; color: #E8E1CF; transform: rotateY(180deg); }
  .flip-front .char { font-size: 60px; }
  .sound-btn {
    background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px;
    position: absolute; top: 10px; right: 10px; opacity: 0.6; line-height: 1;
  }
  .sound-btn:active { opacity: 1; transform: scale(1.1); }
  .quiz-card { position: relative; }
  .sound-btn-quiz { position: absolute; top: 10px; right: 10px; }
  .tone-row { display: flex; align-items: center; gap: 8px; }
  .tone-row span { font-size: 13px; opacity: 0.6; }
  .hint { font-size: 12px; opacity: 0.5; margin-top: 4px; }
  .flip-back .pinyin { font-size: 22px; }
  .flip-back .ru { font-size: 17px; }
  .example {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(232,225,207,0.25);
    text-align: center; width: 100%;
  }
  .example .ex-hanzi { font-family: 'Noto Serif SC', serif; font-size: 18px; display: block; margin-bottom: 4px; }
  .example .ex-pinyin { font-family: 'Spectral', serif; font-style: italic; font-size: 13px; opacity: 0.85; display: block; }
  .example .ex-ru { font-size: 12px; opacity: 0.7; display: block; margin-top: 2px; }

  .row { display: flex; gap: 8px; }
  .status-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .status-btn {
    flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: transparent; border: 1px solid #4A4A52; color: #B8B3A5; font-family: 'Inter', sans-serif;
  }
  .status-btn.active-learning { background: #B8933E; border-color: #B8933E; color: #1B1B20; }
  .status-btn.active-learned { background: #4F6F62; border-color: #4F6F62; color: #E8E1CF; }
  .btn-outline {
    flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: transparent; border: 1px solid #4F6F62; color: #4F6F62; font-family: 'Inter', sans-serif;
  }
  .btn-outline.done { background: #4F6F62; color: #E8E1CF; }
  .btn-solid {
    padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: #E8E1CF; color: #1B1B20; border: none; font-family: 'Inter', sans-serif;
  }
  .counter { text-align: center; font-size: 12px; opacity: 0.5; margin-top: 16px; }

  .quiz-card {
    border-radius: 10px; background: #E8E1CF; color: #1B1B20; height: 180px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px;
  }
  .quiz-card .char { font-size: 56px; font-family: 'Noto Serif SC', serif; }
  .quiz-card .pinyin { font-size: 18px; opacity: 0.6; }
  .quiz-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.6; margin-bottom: 8px; }

  .quiz-sub-modes { display: flex; gap: 8px; margin-bottom: 20px; }
  .quiz-sub-btn {
    flex: 1; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 500;
    background: transparent; border: 1px solid #4A4A52; color: #B8B3A5; font-family: 'Inter', sans-serif;
  }
  .quiz-sub-btn.active { background: #4F6F62; border-color: #4F6F62; color: #E8E1CF; }

  .match-grid { display: flex; gap: 10px; margin-bottom: 16px; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .match-item {
    padding: 12px 10px; border-radius: 8px; border: 1px solid #4A4A52; background: transparent;
    color: #E8E1CF; font-family: 'Inter', sans-serif; font-size: 13px; text-align: center; min-height: 52px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .match-item .mi-hanzi { font-family: 'Noto Serif SC', serif; font-size: 20px; line-height: 1.1; }
  .match-item .mi-pinyin { font-size: 11px; opacity: 0.6; }
  .match-item.selected { border-color: #B8933E; background: rgba(184,147,62,0.15); }
  .match-item.matched { border-color: #4F6F62; background: rgba(79,111,98,0.2); color: #8fada3; }
  .match-item.wrong { border-color: #A6332B; background: rgba(166,51,43,0.2); }
  .match-item.disabled { pointer-events: none; }
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .opt {
    text-align: left; padding: 12px 16px; border-radius: 8px; font-size: 14px;
    border: 1px solid #4A4A52; background: transparent; color: #E8E1CF; font-family: 'Inter', sans-serif;
  }
  .opt.correct { background: #4F6F62; border-color: #4F6F62; color: #E8E1CF; }
  .opt.wrong { background: #A6332B; border-color: #A6332B; color: #E8E1CF; }
  .next-btn { width: 100%; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500; background: #E8E1CF; color: #1B1B20; border: none; font-family: 'Inter', sans-serif; }

  .g-list { display: flex; flex-direction: column; gap: 8px; }
  .g-item {
    text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid #4A4A52;
    background: transparent; color: #E8E1CF; font-family: 'Inter', sans-serif;
  }
  .g-item .g-num { font-family: 'Noto Serif SC', serif; color: #B8933E; font-size: 13px; margin-right: 8px; }
  .g-item .g-title { font-size: 14px; font-weight: 500; }
  .g-back { background: none; border: none; color: #B8933E; font-family: 'Inter', sans-serif; font-size: 13px; padding: 0; margin-bottom: 16px; }
  .g-detail-title { font-size: 20px; margin: 0 0 12px; }
  .g-explain { font-size: 14px; line-height: 1.6; opacity: 0.9; margin-bottom: 16px; }
  .g-formula {
    background: #E8E1CF; color: #1B1B20; padding: 12px 16px; border-radius: 8px;
    font-family: 'Spectral', serif; font-style: italic; font-size: 15px; margin-bottom: 20px; text-align: center;
  }
  .g-ex-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.6; margin-bottom: 10px; }
  .g-example { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #33333a; }
  .g-example:last-child { border-bottom: none; }
  .g-ex-hanzi { font-family: 'Noto Serif SC', serif; font-size: 20px; display: block; margin-bottom: 2px; }
  .g-ex-pinyin { font-family: 'Spectral', serif; font-style: italic; font-size: 13px; opacity: 0.75; display: block; }
  .g-ex-ru { font-size: 13px; opacity: 0.6; display: block; margin-top: 2px; }
  .g-practice {
    margin-top: 24px; padding-top: 20px; border-top: 1px solid #4A4A52;
  }
  .g-practice-q { font-size: 14px; margin-bottom: 12px; font-weight: 500; }

  body { padding-bottom: 78px; }

  .home-hero { display: flex; flex-direction: column; align-items: center; margin: 12px 0 28px; animation: floatSlow 5s ease-in-out infinite; }
  .home-progress-ring {
    position: relative; width: 132px; height: 132px; border-radius: 50%;
    filter: drop-shadow(0 0 18px rgba(166,51,43,0.25));
  }
  .home-progress-ring circle#homeRingFg { transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); animation: ringDraw 1.1s cubic-bezier(.2,.8,.2,1); }
  .home-progress-center {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .home-progress-center b { font-family: 'Noto Serif SC', serif; font-size: 30px; color: #E8E1CF; line-height: 1; }
  .home-progress-center span { font-size: 12px; opacity: 0.5; margin-top: 2px; }
  .home-progress-label { font-size: 12px; opacity: 0.55; margin-top: 12px; letter-spacing: 0.05em; }

  .home-levels { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .home-level-card {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px;
    background: linear-gradient(135deg, #232328, #1f1f24);
    border: 1px solid #33333a; text-align: left; font-family: 'Inter', sans-serif;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .home-level-card:active { border-color: #4A4A52; }
  .home-level-badge {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 15px; flex-shrink: 0;
    box-shadow: 0 0 0 1px currentColor inset;
  }
  .home-level-info { flex: 1; min-width: 0; }
  .home-level-title { font-size: 14px; font-weight: 600; color: #E8E1CF; margin-bottom: 4px; }
  .home-level-bar-track { height: 5px; border-radius: 3px; background: #33333a; overflow: hidden; }
  .home-level-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .home-level-count { font-size: 11px; opacity: 0.5; margin-left: 10px; white-space: nowrap; font-family: 'Inter', sans-serif; }

  .home-continue {
    width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    padding: 16px 18px; border-radius: 12px;
    background: linear-gradient(135deg, #A6332B, #8a2a23);
    border: none; margin-bottom: 16px;
    font-family: 'Inter', sans-serif;
    animation: glowPulse 2.6s ease-in-out infinite;
  }
  .home-continue-label { color: #E8E1CF; font-size: 15px; font-weight: 600; }
  .home-continue-sub { color: #E8CFC8; font-size: 12px; opacity: 0.85; }

  .home-quicklinks { display: flex; gap: 10px; }
  .home-quick-card {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px 10px; border-radius: 12px; background: #232328; border: 1px solid #33333a;
    color: #E8E1CF; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  }
  .home-quick-icon {
    font-family: 'Noto Serif SC', serif; font-size: 20px; color: #B8933E;
  }

  .bottom-tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: #1B1B20; border-top: 1px solid #2c2c33;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .bottom-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: #6b6b74; padding: 6px 2px; font-family: 'Inter', sans-serif; font-size: 10.5px;
    transition: color 0.2s ease;
  }
  .bottom-tab svg { transition: transform 0.25s cubic-bezier(.34,1.56,.64,1); }
  .bottom-tab.active { color: #B8933E; }
  .bottom-tab.active svg { transform: translateY(-2px) scale(1.08); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">汉语 · с нуля</p>
      <h1 class="display">Первые иероглифы</h1>
    </div>
    <div class="seal"><b id="sealCount">0</b><span id="sealTotal">/ 80</span></div>
  </header>

  <div id="homeView">
    <div class="home-hero">
      <div class="home-progress-ring">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="56" fill="none" stroke="#2c2c33" stroke-width="11"/>
          <circle id="homeRingFg" cx="66" cy="66" r="56" fill="none" stroke="#A6332B" stroke-width="11"
            stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="351.9" transform="rotate(-90 66 66)"/>
        </svg>
        <div class="home-progress-center">
          <b id="homeProgressCount">0</b>
          <span id="homeProgressTotal">/ 1202</span>
        </div>
      </div>
      <p class="home-progress-label">слов выучено всего</p>
    </div>

    <div class="home-levels" id="homeLevels"></div>

    <button class="home-continue" id="homeContinueBtn">
      <span class="home-continue-label">Продолжить обучение →</span>
      <span class="home-continue-sub" id="homeContinueSub">HSK1 · Основы 1</span>
    </button>

    <div class="home-quicklinks">
      <button class="home-quick-card" id="homeQuizCard">
        <span class="home-quick-icon">✓</span>
        <span>Тест</span>
      </button>
      <button class="home-quick-card" id="homeGrammarCard">
        <span class="home-quick-icon">文</span>
        <span>Грамматика</span>
      </button>
    </div>
  </div>

  <div id="wordsWrap" style="display:none;">
    <nav id="wordLevelNav" style="display:flex; gap:8px; margin-bottom:14px;"></nav>

    <div id="lessonSelectWrap" class="lesson-select-wrap">
      <button id="lessonSelectBtn" class="lesson-select-btn">
        <span id="lessonSelectLabel">1. Приветствия</span>
        <span class="lesson-select-count" id="lessonSelectCount">8 слов</span>
        <span class="lesson-select-arrow">▾</span>
      </button>
      <div id="lessonDropdown" class="lesson-dropdown" style="display:none;"></div>
    </div>

    <div id="learnView">
      <div class="flip-card" id="flipCard">
        <div class="flip-inner" id="flipInner">
          <div class="flip-face flip-front">
            <span class="char hanzi" id="fCharFront"></span>
            <button class="sound-btn" id="soundBtnFront" aria-label="Произнести">🔊</button>
            <div class="tone-row"><svg id="toneSvg" width="22" height="22" viewBox="0 0 22 22" fill="none"></svg><span id="toneLabel"></span></div>
            <p class="hint">нажми, чтобы перевернуть</p>
          </div>
          <div class="flip-face flip-back">
            <span class="pinyin display" id="fPinyin"></span>
            <span class="ru" id="fRu"></span>
            <div class="example">
              <span class="ex-hanzi hanzi" id="fExHanzi"></span>
              <span class="ex-pinyin" id="fExPinyin"></span>
              <span class="ex-ru" id="fExRu"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="status-row">
        <button class="status-btn" id="learningBtn">Ещё учу</button>
        <button class="status-btn" id="learnedBtn">Выучено</button>
      </div>
      <div class="row">
        <button class="btn-outline" id="prevBtn">← Назад</button>
        <button class="btn-solid" id="nextBtn">Далее →</button>
      </div>
      <p class="counter" id="counter"></p>
    </div>

    <div id="quizView" style="display:none;">
      <div class="quiz-sub-modes">
        <button class="quiz-sub-btn active" id="quizSubChoiceBtn">Варианты</button>
        <button class="quiz-sub-btn" id="quizSubMatchBtn">Пары</button>
      </div>

      <div id="quizChoiceView">
        <div class="quiz-card">
          <span class="char" id="qChar"></span>
          <button class="sound-btn sound-btn-quiz" id="soundBtnQuiz" aria-label="Произнести">🔊</button>
          <span class="pinyin display" id="qPinyin"></span>
        </div>
        <p class="quiz-label">Что это значит?</p>
        <div class="options" id="qOptions"></div>
        <button class="next-btn" id="qNextBtn" style="display:none;">Следующий вопрос →</button>
      </div>

      <div id="quizMatchView" style="display:none;">
        <p class="quiz-label">Соедини иероглиф с переводом</p>
        <div class="match-grid">
          <div class="match-col" id="matchColLeft"></div>
          <div class="match-col" id="matchColRight"></div>
        </div>
        <button class="next-btn" id="matchNextBtn" style="display:none;">Ещё раунд →</button>
      </div>
    </div>

    <div id="grammarView" style="display:none;">
      <nav id="gLevelNav" style="margin-bottom:16px;"></nav>
      <div id="gList" class="g-list"></div>
      <div id="gDetail" style="display:none;">
        <button class="g-back" id="gBackBtn">← Все темы</button>
        <h2 class="g-detail-title display" id="gTitle"></h2>
        <p class="g-explain" id="gExplain"></p>

const GRAMMAR_LEVELS = [
  { id: "basic", label: "Базовый · HSK1", topics: GRAMMAR_BASIC },
  { id: "advanced", label: "Продвинутый · HSK2", topics: GRAMMAR_ADVANCED },
  { id: "hsk3", label: "Свободный · HSK3", topics: GRAMMAR_HSK3 },
  { id: "hsk4", label: "Уверенный · HSK4", topics: GRAMMAR_HSK4 },
];

const ALL_WORDS_BY_LEVEL = {};
WORD_LEVELS.forEach(lvl => { ALL_WORDS_BY_LEVEL[lvl.id] = lvl.topics.flatMap(t => t.words); });
const ALL_WORDS_TOTAL = WORD_LEVELS.flatMap(lvl => lvl.topics.flatMap(t => t.words));
const TONE_LABEL = { 0: "нейтральный", 1: "1-й, ровный", 2: "2-й, восходящий", 3: "3-й, падающе-восходящий", 4: "4-й, падающий" };
const TONE_PATH = {
  0: "M2 11 H20",
  1: "M2 11 H20",
  2: "M2 17 Q11 3 20 3",
  3: "M2 6 Q7 20 11 11 Q15 3 20 17",
  4: "M2 3 Q11 3 20 19",
};

let learned = {};
try {
  const saved = localStorage.getItem("chinese_progress");
  if (saved) learned = JSON.parse(saved);
} catch (e) {}

let wordLevel = "hsk1";
let lessonId = 1;
let mode = "learn";
let index = 0;
let flipped = false;
let quizWord = null;
let quizAnswered = false;

function saveProgress() {
  try { localStorage.setItem("chinese_progress", JSON.stringify(learned)); } catch (e) {}
}

function currentLevelTopics() {
  return WORD_LEVELS.find(l => l.id === wordLevel).topics;
}

function currentWords() {
  return currentLevelTopics().find(l => l.id === lessonId).words;
}

function updateSeal() {
  const count = Object.keys(learned).filter(k => learned[k]).length;
  document.getElementById("sealCount").textContent = count;
  document.getElementById("sealTotal").textContent = "/ " + ALL_WORDS_TOTAL.length;
}

function renderLevelNav() {
  const nav = document.getElementById("wordLevelNav");
  nav.innerHTML = "";
  WORD_LEVELS.forEach(lvl => {
    const b = document.createElement("button");
    b.textContent = lvl.label;
    b.className = "word-level-btn" + (lvl.id === wordLevel ? " active" : "");
    b.onclick = () => {
      wordLevel = lvl.id; lessonId = currentLevelTopics()[0].id; index = 0; flipped = false;
      renderLevelNav(); renderNav(); renderLearn(); if (quizSubMode === "match") startMatchRound(); else renderQuiz(true);
    };
    nav.appendChild(b);
  });
}

function renderNav() {
  const topics = currentLevelTopics();
  const cur = topics.find(l => l.id === lessonId) || topics[0];
  lessonId = cur.id;
  document.getElementById("lessonSelectLabel").textContent = cur.id + ". " + cur.title;
  document.getElementById("lessonSelectCount").textContent = cur.words.length + " слов";

  const dropdown = document.getElementById("lessonDropdown");
  dropdown.innerHTML = "";
  topics.forEach(l => {
    const b = document.createElement("button");
    b.className = "lesson-dropdown-item" + (l.id === lessonId ? " active" : "");
    b.innerHTML = '<span>' + l.id + '. ' + l.title + '</span><span class="ld-count">' + l.words.length + '</span>';
    b.onclick = () => {
      lessonId = l.id; index = 0; flipped = false;
      dropdown.style.display = "none";
      renderNav(); renderLearn(); if (quizSubMode === "match") startMatchRound(); else renderQuiz(true);
    };
    dropdown.appendChild(b);
  });
}

document.getElementById("lessonSelectBtn").onclick = () => {
  const dropdown = document.getElementById("lessonDropdown");
  dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
};
document.addEventListener("click", (e) => {
  const wrap = document.getElementById("lessonSelectWrap");
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById("lessonDropdown").style.display = "none";
  }
});

function renderLearn() {
  const words = currentWords();
  const w = words[index % words.length];
  document.getElementById("fCharFront").textContent = w.hanzi;
  document.getElementById("fPinyin").textContent = w.pinyin;
  document.getElementById("fRu").textContent = w.ru;
  document.getElementById("fExHanzi").textContent = w.ex || "";
  document.getElementById("fExPinyin").textContent = w.exPinyin || "";
  document.getElementById("fExRu").textContent = w.exRu || "";
  document.getElementById("toneLabel").textContent = TONE_LABEL[w.tone];
  document.getElementById("toneSvg").innerHTML =
    '<path d="' + (TONE_PATH[w.tone] || TONE_PATH[1]) + '" stroke="#A6332B" stroke-width="2.4" stroke-linecap="round"/>';
  document.getElementById("flipInner").classList.remove("flipped");
  flipped = false;
  const learningBtn = document.getElementById("learningBtn");
  const learnedBtn = document.getElementById("learnedBtn");
  learningBtn.classList.remove("active-learning");
  learnedBtn.classList.remove("active-learned");
  if (learned[w.hanzi]) { learnedBtn.classList.add("active-learned"); }
  else { learningBtn.classList.add("active-learning"); }
  document.getElementById("counter").textContent = ((index % words.length) + 1) + " / " + words.length + " в этом уроке";
  updateSeal();
}

function renderQuiz(reset) {
  if (mode !== "quiz") return;
  const words = currentWords();
  const w = words[index % words.length];
  quizWord = w;
  quizAnswered = false;
  document.getElementById("qChar").textContent = w.hanzi;
  document.getElementById("qPinyin").textContent = w.pinyin;

  const wrongPool = ALL_WORDS_BY_LEVEL[wordLevel].filter(x => x.hanzi !== w.hanzi);
  const wrongs = [];
  while (wrongs.length < 3 && wrongPool.length) {
    const pick = wrongPool[Math.floor(Math.random() * wrongPool.length)];
    if (!wrongs.find(x => x.hanzi === pick.hanzi)) wrongs.push(pick);
  }
  const opts = [w, ...wrongs].sort(() => Math.random() - 0.5);

  const optsDiv = document.getElementById("qOptions");
  optsDiv.innerHTML = "";
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt.ru;
    btn.onclick = () => {
      if (quizAnswered) return;
      quizAnswered = true;
      const isCorrect = opt.hanzi === w.hanzi;
      if (isCorrect) { learned[w.hanzi] = true; saveProgress(); updateSeal(); }
      [...optsDiv.children].forEach(child => {
        child.disabled = true;
      });
      if (isCorrect) btn.classList.add("correct");
      else {
        btn.classList.add("wrong");
        [...optsDiv.children].find(c => c.textContent === w.ru).classList.add("correct");
      }
      try {
        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
        window.Telegram.WebApp.HapticFeedback.notificationOccurred(isCorrect ? "success" : "error");
      } catch (e) {}
      document.getElementById("qNextBtn").style.display = "block";
    };
    optsDiv.appendChild(btn);
  });
  document.getElementById("qNextBtn").style.display = "none";
  updateSeal();
}

let quizSubMode = "choice";
let matchLeftSel = null;
let matchRightSel = null;
let matchPairs = [];
let matchedCount = 0;

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startMatchRound() {
  const words = currentWords();
  const count = Math.min(6, words.length);
  matchPairs = shuffleArr(words).slice(0, count);
  matchLeftSel = null;
  matchRightSel = null;
  matchedCount = 0;

  const leftOrder = shuffleArr(matchPairs);
  const rightOrder = shuffleArr(matchPairs);

  const leftCol = document.getElementById("matchColLeft");
  const rightCol = document.getElementById("matchColRight");
  leftCol.innerHTML = "";
  rightCol.innerHTML = "";

  leftOrder.forEach(w => {
    const btn = document.createElement("button");
    btn.className = "match-item";
    btn.dataset.hanzi = w.hanzi;
    btn.innerHTML = '<span class="mi-hanzi">' + w.hanzi + '</span><span class="mi-pinyin">' + w.pinyin + '</span>';
    btn.onclick = () => onMatchPick("left", w.hanzi, btn);
    leftCol.appendChild(btn);
  });
  rightOrder.forEach(w => {
    const btn = document.createElement("button");
    btn.className = "match-item";
    btn.dataset.hanzi = w.hanzi;
    btn.textContent = w.ru;
    btn.onclick = () => onMatchPick("right", w.hanzi, btn);
    rightCol.appendChild(btn);
  });

  document.getElementById("matchNextBtn").style.display = "none";
}

function onMatchPick(side, hanzi, btn) {
  if (btn.classList.contains("matched") || btn.classList.contains("disabled")) return;
  if (side === "left") {
    if (matchLeftSel) matchLeftSel.btn.classList.remove("selected");
    matchLeftSel = { hanzi, btn };
    btn.classList.add("selected");
  } else {
    if (matchRightSel) matchRightSel.btn.classList.remove("selected");
    matchRightSel = { hanzi, btn };
    btn.classList.add("selected");
  }

  if (matchLeftSel && matchRightSel) {
    const isMatch = matchLeftSel.hanzi === matchRightSel.hanzi;
    const l = matchLeftSel.btn, r = matchRightSel.btn;
    if (isMatch) {
      l.classList.remove("selected"); r.classList.remove("selected");
      l.classList.add("matched"); r.classList.add("matched");
      learned[matchLeftSel.hanzi] = true;
      saveProgress();
      matchedCount++;
      try {
        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
        window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
      } catch (e) {}
      updateSeal();
      if (matchedCount === matchPairs.length) {
        const nextBtn = document.getElementById("matchNextBtn");
        nextBtn.style.display = "block";
        nextBtn.style.animation = "celebrate 0.5s ease";
        document.querySelectorAll("#quizMatchView .match-item").forEach((el, i) => {
          el.style.animation = "celebrate 0.4s ease";
          el.style.animationDelay = (i * 0.03) + "s";
        });
        try {
          window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
          window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
        } catch (e) {}
      }
    } else {
      l.classList.add("wrong"); r.classList.add("wrong");
      l.classList.add("disabled"); r.classList.add("disabled");
      try {
        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
        window.Telegram.WebApp.HapticFeedback.notificationOccurred("error");
      } catch (e) {}
      setTimeout(() => {
        l.classList.remove("wrong", "disabled", "selected");
        r.classList.remove("wrong", "disabled", "selected");
      }, 600);
    }
    matchLeftSel = null;
    matchRightSel = null;
  }
}

document.getElementById("quizSubChoiceBtn").onclick = () => {
  quizSubMode = "choice";
  document.getElementById("quizSubChoiceBtn").classList.add("active");
  document.getElementById("quizSubMatchBtn").classList.remove("active");
  document.getElementById("quizChoiceView").style.display = "block";
  document.getElementById("quizMatchView").style.display = "none";
  renderQuiz();
};

document.getElementById("quizSubMatchBtn").onclick = () => {
  quizSubMode = "match";
  document.getElementById("quizSubMatchBtn").classList.add("active");
  document.getElementById("quizSubChoiceBtn").classList.remove("active");
  document.getElementById("quizChoiceView").style.display = "none";
  document.getElementById("quizMatchView").style.display = "block";
  startMatchRound();
};

document.getElementById("matchNextBtn").onclick = () => startMatchRound();

function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-CN";
    utter.rate = 0.85;
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang === "zh-CN") || voices.find(v => v.lang && v.lang.startsWith("zh"));
    if (zhVoice) utter.voice = zhVoice;
    window.speechSynthesis.speak(utter);
    try {
      window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
      window.Telegram.WebApp.HapticFeedback.impactOccurred("light");
    } catch (e) {}
  } catch (e) {}
}

document.getElementById("flipCard").onclick = () => {
  flipped = !flipped;
  document.getElementById("flipInner").classList.toggle("flipped", flipped);
};

document.getElementById("soundBtnFront").onclick = (e) => {
  e.stopPropagation();
  const words = currentWords();

  speak(w.hanzi);
};

document.getElementById("soundBtnQuiz").onclick = (e) => {
  e.stopPropagation();
  if (quizWord) speak(quizWord.hanzi);
};

document.getElementById("learningBtn").onclick = () => {
  const words = currentWords();
  const w = words[index % words.length];
  learned[w.hanzi] = false;
  saveProgress();
  renderLearn();
};

document.getElementById("learnedBtn").onclick = () => {
  const words = currentWords();

  learned[w.hanzi] = true;
  saveProgress();
  renderLearn();
};

document.getElementById("prevBtn").onclick = () => {
  const words = currentWords();
  index = (index - 1 + words.length) % words.length;
  renderLearn();
};

document.getElementById("nextBtn").onclick = () => {
  const words = currentWords();
  index = (index + 1) % words.length;
  renderLearn();
};

document.getElementById("qNextBtn").onclick = () => {
  const words = currentWords();
  index = (index + 1) % words.length;
  renderQuiz();
};

function showScreen(screen) {
  document.getElementById("homeView").style.display = screen === "home" ? "block" : "none";
  document.getElementById("wordsWrap").style.display = screen === "home" ? "none" : "block";
  document.getElementById("learnView").style.display = screen === "learn" ? "block" : "none";
  document.getElementById("quizView").style.display = screen === "quiz" ? "block" : "none";
  document.getElementById("grammarView").style.display = screen === "grammar" ? "block" : "none";
  document.getElementById("lessonSelectWrap").style.display = (screen === "learn" || screen === "quiz") ? "block" : "none";
  document.getElementById("wordLevelNav").style.display = (screen === "learn" || screen === "quiz") ? "flex" : "none";

  const tabMap = { home: "tabHome", learn: "tabLearn", quiz: "tabQuiz", grammar: "tabGrammar" };
  ["tabHome", "tabLearn", "tabQuiz", "tabGrammar"].forEach(id => document.getElementById(id).classList.remove("active"));
  document.getElementById(tabMap[screen]).classList.add("active");

  if (screen === "learn") { mode = "learn"; index = 0; renderLearn(); }
  else if (screen === "quiz") { mode = "quiz"; index = 0; if (quizSubMode === "match") startMatchRound(); else renderQuiz(); }
  else if (screen === "grammar") { mode = "grammar"; showGrammarList(); }
  else if (screen === "home") { renderHome(); }

  const activeEl = document.getElementById(screen === "home" ? "homeView" : "wordsWrap");
  activeEl.classList.remove("screen-enter");
  void activeEl.offsetWidth;
  activeEl.classList.add("screen-enter");
}

document.getElementById("tabHome").onclick = () => showScreen("home");
document.getElementById("tabLearn").onclick = () => showScreen("learn");
document.getElementById("tabQuiz").onclick = () => showScreen("quiz");
document.getElementById("tabGrammar").onclick = () => showScreen("grammar");
document.getElementById("homeQuizCard").onclick = () => showScreen("quiz");
document.getElementById("homeGrammarCard").onclick = () => showScreen("grammar");
document.getElementById("homeContinueBtn").onclick = () => showScreen("learn");

const LEVEL_COLORS = {
  hsk1: "#A6332B", hsk2: "#B8933E", hsk3: "#4F6F62", hsk4: "#6B5B95",
};

function renderHome() {
  const totalLearned = Object.keys(learned).filter(k => learned[k]).length;
  document.getElementById("homeProgressCount").textContent = totalLearned;
  document.getElementById("homeProgressTotal").textContent = "/ " + ALL_WORDS_TOTAL.length;
  const circumference = 2 * Math.PI * 56;
  const pct = Math.min(1, totalLearned / ALL_WORDS_TOTAL.length);
  document.getElementById("homeRingFg").style.strokeDashoffset = String(circumference * (1 - pct));

  const levelsDiv = document.getElementById("homeLevels");
  levelsDiv.innerHTML = "";
  WORD_LEVELS.forEach((lvl, i) => {
    const words = ALL_WORDS_BY_LEVEL[lvl.id];
    const done = words.filter(w => learned[w.hanzi]).length;
    const color = LEVEL_COLORS[lvl.id];
    const card = document.createElement("button");
    card.className = "home-level-card";
    card.style.animation = "fadeSlideIn 0.4s cubic-bezier(.2,.8,.2,1) both";
    card.style.animationDelay = (i * 0.07) + "s";
    card.innerHTML =
      '<div class="home-level-badge" style="background:' + color + '22; color:' + color + ';">' + lvl.label + '</div>' +
      '<div class="home-level-info">' +
        '<div class="home-level-title">' + lvl.label + '</div>' +
        '<div class="home-level-bar-track"><div class="home-level-bar-fill" style="width:' + Math.round((done / words.length) * 100) + '%; background:' + color + ';"></div></div>' +
      '</div>' +
      '<div class="home-level-count">' + done + '/' + words.length + '</div>';
    card.onclick = () => {
      wordLevel = lvl.id;
      lessonId = currentLevelTopics()[0].id;
      showScreen("learn");
      renderLevelNav();
      renderNav();
    };
    levelsDiv.appendChild(card);
  });

  const curLevel = WORD_LEVELS.find(l => l.id === wordLevel);
  const curTopic = curLevel.topics.find(t => t.id === lessonId) || curLevel.topics[0];
  document.getElementById("homeContinueSub").textContent = curLevel.label + " · " + curTopic.title;
}

function setActiveModeBtn(id) {}


let grammarLevel = "basic";

function renderGLevelNav() {
  const nav = document.getElementById("gLevelNav");
  nav.innerHTML = "";
  nav.style.display = "flex";
  nav.style.gap = "8px";
  GRAMMAR_LEVELS.forEach(lvl => {
    const b = document.createElement("button");
    b.textContent = lvl.label;
    b.style.cssText = "font-family:'Inter',sans-serif;font-size:12px;padding:7px 14px;border-radius:999px;white-space:nowrap;border:1px solid #4A4A52;background:transparent;color:#B8B3A5;";
    if (lvl.id === grammarLevel) {
      b.style.background = "#A6332B"; b.style.borderColor = "#A6332B"; b.style.color = "#E8E1CF";
    }
    b.onclick = () => { grammarLevel = lvl.id; showGrammarList(); };
    nav.appendChild(b);
  });
}

function currentGrammarTopics() {
  return GRAMMAR_LEVELS.find(l => l.id === grammarLevel).topics;
}

function showGrammarList() {
  renderGLevelNav();
  document.getElementById("gList").style.display = "flex";
  document.getElementById("gDetail").style.display = "none";
  const list = document.getElementById("gList");
  list.innerHTML = "";
  currentGrammarTopics().forEach(g => {
    const btn = document.createElement("button");
    btn.className = "g-item";
    btn.innerHTML = '<span class="g-num hanzi">' + String(g.id).padStart(2, "0") + '</span><span class="g-title">' + g.title + '</span>';
    btn.onclick = () => showGrammarDetail(g.id);
    list.appendChild(btn);
  });
}

function showGrammarDetail(id) {
  const g = currentGrammarTopics().find(x => x.id === id);
  document.getElementById("gLevelNav").style.display = "none";
  document.getElementById("gList").style.display = "none";
  document.getElementById("gDetail").style.display = "block";
  document.getElementById("gTitle").textContent = g.title;
  document.getElementById("gExplain").textContent = g.explain;
  document.getElementById("gFormula").textContent = g.formula;

  const exDiv = document.getElementById("gExamples");
  exDiv.innerHTML = "";
  g.examples.forEach(ex => {
    const d = document.createElement("div");
    d.className = "g-example";
    d.innerHTML =
      '<span class="g-ex-hanzi">' + ex.hanzi + '</span>' +
      '<span class="g-ex-pinyin">' + ex.pinyin + '</span>' +
      '<span class="g-ex-ru">' + ex.ru + '</span>';
    exDiv.appendChild(d);
  });

  document.getElementById("gPracticeQ").textContent = g.practice.q;
  const optsDiv = document.getElementById("gPracticeOpts");
  optsDiv.innerHTML = "";
  let answered = false;
  g.practice.opts.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.className = "opt hanzi";
    btn.textContent = optText;
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      [...optsDiv.children].forEach(c => c.disabled = true);
      if (i === g.practice.correct) btn.classList.add("correct");
      else {
        btn.classList.add("wrong");
        optsDiv.children[g.practice.correct].classList.add("correct");
      }
      try {
        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback &&
        window.Telegram.WebApp.HapticFeedback.notificationOccurred(i === g.practice.correct ? "success" : "error");
      } catch (e) {}
    };
    optsDiv.appendChild(btn);
  });
}

document.getElementById("gBackBtn").onclick = showGrammarList;

renderLevelNav();
renderNav();
showScreen("home");
